<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Digiconnect Scheduler Prototype</title>
  <style>
    :root{--ink:#181529;--muted:#777486;--line:#e6e3ea;--surface:#fff;--bg:#f7f6f9;--purple:#5a3f9d;--purple2:#46307d;--soft:#f1edfa;--green:#20805d;--greenSoft:#eaf7f1;--orange:#b5611b;--orangeSoft:#fff4e9}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,select,input{font:inherit}button{cursor:pointer}
    button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid rgba(90,63,157,.24);outline-offset:2px}
    .topbar{height:68px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}
    .brand,.actions,.title-row,.footer,.person,.summary-strip,.schedule-status,.pdf-card{display:flex;align-items:center}.brand{gap:11px}.mark{width:34px;height:34px;border-radius:10px;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:800}.brand strong{display:block;font-size:14px;letter-spacing:.1em}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:11px}.actions{gap:14px}.saved{color:var(--green);font-size:12px}
    .ghost,.text,.skip{border:0;background:transparent;color:var(--purple);font-weight:700}.ghost{font-size:12px}.text{font-size:10px}.skip{font-size:11px}
    .demo{min-height:42px;padding:6px 32px;background:#211b35;color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;font-size:11px}.demo select{color:#fff;background:#33294f;border:1px solid #584c78;border-radius:8px;padding:6px 28px 6px 10px}
    .shell{width:min(980px,calc(100% - 32px));margin:auto;padding:28px 0 64px}.steps{width:min(690px,100%);margin:0 auto 22px;display:grid;grid-template-columns:repeat(4,1fr)}.steps.five{width:min(780px,100%);grid-template-columns:repeat(5,1fr)}.step{position:relative;color:#aaa6b4;display:flex;align-items:center;gap:8px;font-size:11px}.step:after{content:"";position:absolute;height:1px;background:#d8d4df;left:28px;right:8px;top:12px;z-index:-1}.step:last-child:after{display:none}.step i{width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid #d8d4df;display:grid;place-items:center;font-size:10px;font-style:normal}.step.active{color:var(--purple)}.step.active i{color:#fff;border-color:var(--purple);background:var(--purple)}
    .card{width:min(760px,100%);margin:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 12px 32px rgba(31,25,50,.05)}.scheduler{width:min(900px,100%)}.title-row{justify-content:space-between;gap:24px;align-items:flex-start}.eyebrow{display:block;color:var(--purple);text-transform:uppercase;letter-spacing:.09em;font-size:10px;font-weight:800;margin-bottom:7px}h1,h2,p{margin-top:0}h1{font-size:26px;line-height:1.18;margin-bottom:8px;letter-spacing:-.02em}.title-row p{margin:0;max-width:590px;color:var(--muted);font-size:13px;line-height:1.55}.chip{flex-shrink:0;display:inline-block;border-radius:999px;padding:6px 10px;color:var(--purple);background:var(--soft);font-size:10px;font-weight:800;white-space:nowrap}.chip.green{color:var(--green);background:var(--greenSoft)}
    .role{margin:-8px 0 24px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:14px;color:var(--purple);background:var(--soft);border-radius:10px;font-size:10px}.role strong{font-size:11px}.role.as{color:var(--green);background:var(--greenSoft)}
    .summary{margin:24px 0 16px;display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}.summary div{min-height:75px;padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.summary div:nth-child(2n){border-right:0}.summary div:nth-child(n+3){border-bottom:0}.summary span,.summary strong{display:block}.summary span{margin-bottom:5px;color:var(--muted);font-size:10px}.summary strong{font-size:13px}
    .person{gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px}.avatar{width:42px;height:42px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;color:var(--purple);background:var(--soft);font-weight:800;font-size:12px}.person .details{min-width:0;flex:1}.person .eyebrow{margin-bottom:3px;font-size:8px}.person strong{display:block;font-size:13px}.person p{margin:3px 0 0;color:var(--muted);font-size:10px}.verified{color:var(--green);background:var(--greenSoft);border-radius:999px;padding:5px 8px;font-size:9px;font-weight:700}
    .info{margin-top:16px;display:flex;gap:11px;padding:14px;color:var(--ink);background:var(--soft);border-radius:12px}.info>i{width:22px;height:22px;flex-shrink:0;display:grid;place-items:center;color:#fff;background:var(--purple);border-radius:50%;font-size:11px;font-weight:800;font-style:normal}.info strong{font-size:12px}.info p{margin:3px 0 0;color:var(--muted);font-size:11px;line-height:1.5}
    .footer{justify-content:space-between;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}.footer>div{display:flex;align-items:center;gap:12px}.primary,.secondary{min-height:42px;border-radius:10px;padding:0 18px;font-size:12px;font-weight:800}.primary{color:#fff;background:var(--purple);border:1px solid var(--purple)}.primary:hover{background:var(--purple2)}.primary:disabled{cursor:not-allowed;opacity:.4}.secondary{color:var(--ink);background:#fff;border:1px solid #d8d4df}.secondary.compact{min-height:34px;padding:0 12px}
    .handoff{text-align:center;width:min(650px,100%)}.big-icon{width:54px;height:54px;margin:0 auto 14px;display:grid;place-items:center;border-radius:50%;background:var(--soft);color:var(--purple);font-size:20px}.handoff>p{max-width:530px;margin:0 auto;color:var(--muted);font-size:12px;line-height:1.6}.handoff-list{margin:24px 0 18px;text-align:left;border:1px solid var(--line);border-radius:12px;overflow:hidden}.handoff-list>div{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--line)}.handoff-list>div:last-child{border:0}.handoff-list i{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--purple);color:#fff;font-size:10px;font-weight:800;font-style:normal}.handoff-list strong,.handoff-list small{display:block}.handoff-list strong{font-size:11px}.handoff-list small{margin-top:3px;color:var(--muted);font-size:9px}.full{width:100%;margin-top:18px}
    .timezone{padding:9px 11px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:9px;text-align:right;line-height:1.4;white-space:nowrap}.timezone b{color:var(--ink);font-size:10px}
    .explainer{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;border:1px solid #d9d1ee;border-radius:14px;overflow:hidden}.reason,.what{padding:17px}.reason{display:flex;gap:11px;background:var(--soft)}.what{background:#fcfbfd;border-left:1px solid #d9d1ee}.ex-icon{width:25px;height:25px;flex-shrink:0;display:grid;place-items:center;color:#fff;background:var(--purple);border-radius:50%;font-size:11px;font-weight:800}.explainer strong{display:block;margin-bottom:6px;font-size:12px}.explainer p,.explainer li{color:var(--muted);font-size:10px;line-height:1.55}.explainer p{margin:0}.explainer ol{margin:0;padding-left:17px}.explainer li+li{margin-top:3px}
    .rules{margin:22px 0 18px;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}.rules>div{position:relative;padding:12px 12px 12px 42px;border-right:1px solid var(--line)}.rules>div:last-child{border:0}.rules i{position:absolute;left:13px;top:12px;color:var(--purple);font-size:17px;font-style:normal}.rules b,.rules small{display:block}.rules b{font-size:10px}.rules small{color:var(--muted);font-size:8px;margin-top:3px}
    .slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.day{border:1px solid var(--line);border-radius:12px;overflow:hidden}.day-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;background:#faf9fb;border-bottom:1px solid var(--line);font-size:11px}.day-date{display:flex;gap:6px}.day-date span{color:var(--muted)}.counter{color:var(--muted);font-size:8px}.counter.full{color:var(--green)}.slots{max-height:280px;padding:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px;overflow:auto}.slot{min-height:36px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--purple);background:#fff;border:1px solid var(--line);border-radius:8px;font-size:10px;font-weight:700}.slot:hover{border-color:var(--purple);background:var(--soft)}.slot.selected{color:#fff;border-color:var(--purple);background:var(--purple)}.slot:disabled{cursor:not-allowed;color:#b9b5c2;background:#f8f7f9;border-color:#ece9ef;opacity:.7}
    .selected-tags{display:flex;flex-wrap:wrap;gap:6px}.selected-tags span{display:inline-flex;align-items:center;gap:5px;padding:6px 8px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;font-size:8px}.selected-tags b{color:var(--purple)}.summary-strip{align-items:flex-start;gap:10px;margin-top:14px;padding:12px;border:1px solid #bfe2d4;border-radius:12px;background:var(--greenSoft)}.check{width:26px;height:26px;flex-shrink:0;display:grid;place-items:center;color:#fff;background:var(--green);border-radius:50%;font-size:11px}.summary-strip .sum-body{flex:1}.summary-strip .sum-title{display:block;color:var(--green);font-size:9px;margin-bottom:7px}
    .required{margin-top:12px;display:flex;align-items:center;gap:9px;padding:10px 12px;color:var(--orange);background:var(--orangeSoft);border-radius:10px}.required>i{width:21px;height:21px;display:grid;place-items:center;color:#fff;background:var(--orange);border-radius:50%;font-size:10px;font-weight:900;font-style:normal}.required p{margin:0;font-size:10px}.required.complete{color:var(--green);background:var(--greenSoft)}.required.complete>i{background:var(--green)}.skip-note{margin:10px 0 0;color:var(--muted);font-size:9px;text-align:right}
    .saved-panel{margin-top:22px;padding:18px;border:1px solid #bfe2d4;border-radius:14px;background:var(--greenSoft)}.saved-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}.saved-head h2{margin:0;font-size:16px}.saved-panel>p{margin:12px 0 0;color:var(--muted);font-size:10px}
    .consent{width:min(700px,100%)}.consent .person{margin-top:22px}.schedule-status{align-items:flex-start;gap:12px;margin-top:14px;padding:14px;border:1px solid #bfe2d4;border-radius:12px;background:var(--greenSoft)}.schedule-status.warning{border-color:#f0cfad;background:var(--orangeSoft)}.doc{width:40px;height:44px;display:grid;place-items:center;flex-shrink:0;color:var(--purple);background:#fff;border:1px solid var(--line);border-radius:8px;font-size:9px;font-weight:900}.schedule-status .status-body{flex:1}.schedule-status strong{font-size:12px}.schedule-status p{margin:7px 0 0;color:var(--muted);font-size:9px}.schedule-status .selected-tags{margin-top:8px}
    .consent-check{margin-top:18px;display:flex;align-items:flex-start;gap:11px;padding:15px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.consent-check input{width:17px;height:17px;margin:2px 0 0;accent-color:var(--purple)}.consent-check strong,.consent-check small{display:block}.consent-check strong{font-size:12px}.consent-check small{margin-top:4px;color:var(--muted);font-size:9px;line-height:1.5}
    .confirmation{text-align:center;width:min(680px,100%)}.success{width:54px;height:54px;margin:0 auto 14px;display:grid;place-items:center;border-radius:50%;background:var(--green);color:#fff;font-size:23px}.confirmation>p{max-width:550px;margin:0 auto;color:var(--muted);font-size:12px;line-height:1.6}.confirm-list{margin:24px 0 14px;text-align:left;border:1px solid var(--line);border-radius:12px;overflow:hidden}.confirm-list>div{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--line)}.confirm-list>div:last-child{border:0}.confirm-list i{width:24px;height:24px;display:grid;place-items:center;flex-shrink:0;border-radius:50%;background:var(--greenSoft);color:var(--green);font-size:10px;font-style:normal}.confirm-list .attention i{color:var(--orange);background:var(--orangeSoft)}.confirm-list strong,.confirm-list small{display:block}.confirm-list strong{font-size:11px}.confirm-list small{margin-top:3px;color:var(--muted);font-size:9px}.confirm-slots{margin:14px 0;padding:14px;border:1px solid var(--line);border-radius:12px;text-align:left}.confirm-slots .selected-tags{margin-top:8px}.pdf-card{gap:11px;padding:12px;border:1px solid var(--line);border-radius:12px;text-align:left}.pdf-card .pdf-body{flex:1}.pdf-card strong,.pdf-card small{display:block}.pdf-card strong{font-size:11px}.pdf-card small{margin-top:3px;color:var(--muted);font-size:9px}.confirmation .info{text-align:left}
    @media(max-width:720px){.topbar{height:60px;padding:0 16px}.saved,.step b{display:none}.demo{padding:7px 12px;justify-content:space-between}.demo select{max-width:260px}.shell{width:calc(100% - 20px);padding-top:18px}.steps{max-width:230px}.steps.five{max-width:280px}.card{border-radius:14px;padding:20px 16px}.title-row{gap:12px}h1{font-size:22px}.summary{grid-template-columns:1fr}.summary div{border-right:0!important;border-bottom:1px solid var(--line)!important}.summary div:last-child{border-bottom:0!important}.verified{display:none}.role{align-items:flex-start;flex-direction:column}.explainer{grid-template-columns:1fr}.what{border-left:0;border-top:1px solid #d9d1ee}.rules{grid-template-columns:1fr}.rules>div{border-right:0;border-bottom:1px solid var(--line)}.slot-grid{grid-template-columns:1fr}.slots{max-height:260px;grid-template-columns:repeat(4,1fr)}.footer{align-items:stretch}.footer>div{flex:1;justify-content:flex-end}.summary-strip{flex-wrap:wrap}.summary-strip .sum-body{min-width:calc(100% - 40px)}}
    @media(max-width:480px){.brand small,.ghost,.demo>span{display:none}.demo select{width:100%;max-width:none}.title-row{display:block}.title-row>.chip,.timezone{display:inline-block;margin-top:12px}.footer{flex-direction:column-reverse}.footer>div{display:grid;grid-template-columns:1fr 1.4fr}.footer .primary,.footer .secondary{width:100%}.slots{grid-template-columns:repeat(3,1fr)}.person p{white-space:normal}}
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    (() => {
      const company={name:"Northstar Trading L.L.C.",signatory:"Maya Rahman",email:"maya@northstar.ae",phone:"+971 50 123 4567",formFiller:"Omar Saeed",ruyaReference:"RUYA-DC-2026-004812"};
      const uaeHolidays=new Set(["2026-01-01","2026-03-20","2026-03-21","2026-05-26","2026-06-16","2026-08-26","2026-12-02","2026-12-03"]);
      const ruyaNonWorkingDays=new Set([]);
      const state={screen:"review",journey:"same",selected:[],consented:false,locked:false,skipped:false};
      const app=document.getElementById("app");
      const iso=d=>d.toISOString().slice(0,10);
      function gstToday(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Dubai",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const v=Object.fromEntries(p.map(x=>[x.type,x.value]));return new Date(Date.UTC(+v.year,+v.month-1,+v.day))}
      function working(d){const day=d.getUTCDay(),s=iso(d);return day!==0&&day!==6&&!uaeHolidays.has(s)&&!ruyaNonWorkingDays.has(s)}
      function addWorking(start,n){const d=new Date(start);let a=0;while(a<n){d.setUTCDate(d.getUTCDate()+1);if(working(d))a++}return d}
      function days(){const first=addWorking(gstToday(),3),out=[],d=new Date(first);while(out.length<3){if(working(d))out.push(new Date(d));d.setUTCDate(d.getUTCDate()+1)}return out}
      function time(m){const h=Math.floor(m/60),min=m%60,s=h>=12?"PM":"AM";return `${h%12||12}:${String(min).padStart(2,"0")} ${s}`}
      function slotsForDay(d){const dayLabel=new Intl.DateTimeFormat("en-GB",{weekday:"short",timeZone:"UTC"}).format(d),dateLabel=new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",timeZone:"UTC"}).format(d);return Array.from({length:16},(_,i)=>{const m=540+i*30;return{id:`${iso(d)}-${m}`,dateISO:iso(d),dayLabel,dateLabel,start:time(m),end:time(m+30)}})}
      const daySlots=days().map(day=>({day,slots:slotsForDay(day)}));
      const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
      const sortSlots=s=>[...s].sort((a,b)=>a.id.localeCompare(b.id));
      function fullSlot(s){const d=new Date(`${s.dateISO}T00:00:00Z`),date=new Intl.DateTimeFormat("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).format(d);return `${date}, ${s.start}–${s.end} GST`}
      function slotTags(slots){return `<div class="selected-tags">${sortSlots(slots).map(s=>`<span><b>${s.dayLabel} ${s.dateLabel}</b>${s.start}–${s.end}</span>`).join("")}</div>`}
      function person(context="Authorised signatory"){return `<div class="person"><div class="avatar">MR</div><div class="details"><span class="eyebrow">${context}</span><strong>${company.signatory}</strong><p>${company.email} · ${company.phone}</p></div><span class="verified">Identity details added</span></div>`}
      function summary(){return `<div class="summary"><div><span>Company</span><strong>${company.name}</strong></div><div><span>Application</span><strong>Business Account</strong></div><div><span>Documents</span><strong>8 uploaded</strong></div><div><span>Authorised signatory</span><strong>${company.signatory}</strong></div></div>${person()}`}
      function steps(){const different=state.journey==="separate",items=different?[["review","Prepare"],["handoff,signatoryReview","Signatory review"],["scheduler","Preferences"],["consent","Consent"],["confirmation","Submitted"]]:[["review","Review"],["scheduler","Preferences"],["consent","Consent"],["confirmation","Submitted"]];let active=items.findIndex(x=>x[0].split(",").includes(state.screen));if(active<0)active=0;return `<div class="steps ${different?"five":""}">${items.map((x,i)=>`<div class="step ${i<=active?"active":""}"><i>${i<active?"✓":i+1}</i><b>${x[1]}</b></div>`).join("")}</div>`}
      function shell(content){return `<header class="topbar"><div class="brand"><div class="mark">A</div><div><strong>ALAAN</strong><small>Business verification</small></div></div><div class="actions"><span class="saved">✓ Progress saved</span><button class="ghost" data-action="reset">Reset demo</button></div></header><div class="demo"><span>View journey</span><select id="journey"><option value="same" ${state.journey==="same"?"selected":""}>Form filler is the authorised signatory</option><option value="separate" ${state.journey==="separate"?"selected":""}>Form filler and signatory are different people</option><option value="returning" ${state.journey==="returning"?"selected":""}>Returning signatory with saved slots</option></select></div><section class="shell">${steps()}${content}</section>`}
      function review(){const separate=state.journey==="separate";return `<div class="card"><div class="role"><span>${separate?"You are completing for the company":"You are completing and signing"}</span><strong>${separate?company.formFiller+" · Form filler":company.signatory+" · Form filler and authorised signatory"}</strong></div><div class="title-row"><div><span class="eyebrow">Application review</span><h1>${separate?`Review before sending to ${company.signatory}`:"Review your application"}</h1><p>${separate?`${company.signatory} must review the application, share preferred call times and give consent.`:"Check the information below. You will then share preferred times for the required Ruya call and give consent."}</p></div><span class="chip">Ready for review</span></div>${summary()}<div class="info"><i>i</i><div><strong>${separate?`Only ${company.signatory} can complete the final steps`:"You will choose preferred call times next"}</strong><p>${separate?`We will email ${company.signatory} a secure link. The application is submitted only after she reviews it, shares availability and consents.`:"Because you are the authorised signatory, you can share availability, consent and submit the application yourself."}</p></div></div><div class="footer"><button class="secondary">Back</button><button class="primary" data-action="review-next">${separate?`Send to ${company.signatory}`:"Continue to availability"}</button></div></div>`}
      function handoff(){return `<div class="card handoff"><div class="big-icon">→</div><span class="eyebrow">Secure handoff sent</span><h1>${company.signatory} must complete the final steps</h1><p>We sent a secure link to <strong>${company.email}</strong>. The application remains saved until the authorised signatory completes the steps below.</p><div class="handoff-list"><div><i>1</i><div><strong>Review the application</strong><small>Confirm the company and signatory details prepared by ${company.formFiller}.</small></div></div><div><i>2</i><div><strong>Share preferred call times</strong><small>Select up to three 30-minute slots per day across the three days shown.</small></div></div><div><i>3</i><div><strong>Give consent and submit</strong><small>Authorise Alaan to send the application and availability to Ruya.</small></div></div></div><div class="info"><i>i</i><div><strong>What happens to the form filler?</strong><p>${company.formFiller} can leave this page. We will notify them after ${company.signatory} submits.</p></div></div><button class="primary full" data-action="open-signatory">Open signatory link (prototype)</button></div>`}
      function signatoryReview(){return `<div class="card"><div class="role as"><span>You are reviewing as the authorised signatory</span><strong>${company.signatory}</strong></div><div class="title-row"><div><span class="eyebrow">Application prepared by ${company.formFiller}</span><h1>Review the application prepared for you</h1><p>Confirm the information is correct before sharing your preferred call times.</p></div><span class="chip">Action required</span></div>${summary()}<div class="info"><i>i</i><div><strong>You are responsible for the final submission</strong><p>As the authorised signatory, you must share your availability and provide consent.</p></div></div><div class="footer"><button class="secondary" data-action="back-handoff">Back</button><button class="primary" data-action="to-scheduler">Continue to availability</button></div></div>`}
      function countForDay(date){return state.selected.filter(s=>s.dateISO===date).length}
      function scheduler(){let body;if(state.locked){body=`<div class="saved-panel"><div class="saved-head"><div><span class="eyebrow">Previously selected</span><h2>${state.selected.length} preferred slots saved</h2></div><span class="chip green">Read-only</span></div>${slotTags(state.selected)}<p>These slots cannot be changed here. Ruya will contact you directly to confirm one or suggest an alternative.</p></div>`}else{body=`<div class="rules"><div><i>◷</i><b>30-minute slots</b><small>9:00 AM–5:00 PM GST</small></div><div><i>3</i><b>Up to 3 per day</b><small>Select at least 1 overall</small></div><div><i>▦</i><b>3 working days</b><small>UAE and Ruya holidays excluded</small></div></div><div class="slot-grid">${daySlots.map(({day,slots})=>{const count=countForDay(iso(day));return `<div class="day"><div class="day-head"><div class="day-date"><strong>${slots[0].dayLabel}</strong><span>${slots[0].dateLabel}</span></div><b class="counter ${count===3?"full":""}">${count}/3 selected</b></div><div class="slots">${slots.map(s=>{const chosen=state.selected.some(x=>x.id===s.id),disabled=!chosen&&count>=3;return `<button class="slot ${chosen?"selected":""}" data-slot="${s.id}" ${disabled?"disabled":""}>${chosen?"✓ ":""}${s.start}</button>`}).join("")}</div></div>`}).join("")}</div>`}
        const selected=state.selected.length?`<div class="summary-strip"><span class="check">✓</span><div class="sum-body"><span class="sum-title">Preferred slots selected · ${state.selected.length} total</span>${slotTags(state.selected)}</div>${state.locked?"":'<button class="text" data-action="clear">Clear all</button>'}</div>`:"";
        return `<div class="card scheduler"><div class="title-row"><div><span class="eyebrow">Digiconnect call availability</span><h1>${state.locked?"Your preferred call slots":"When are you available?"}</h1><p>Select the times that work for you. Ruya will choose one preferred slot and contact you directly to confirm.</p></div><div class="timezone">UAE time<br><b>GST (GMT+4)</b></div></div><div class="explainer"><div class="reason"><span class="ex-icon">✓</span><div><strong>Why is this call needed?</strong><p>Ruya must verify the authorised signatory’s identity and confirm they are authorised to open the account. This regulatory and security check is required before Ruya completes its review.</p></div></div><div class="what"><strong>What happens next?</strong><ol><li>Share one or more preferred 30-minute call slots.</li><li>Ruya selects one and contacts you to confirm.</li><li>Keep the original Emirates ID or passport ready.</li><li>Ruya verifies your identity, role and authority.</li></ol></div></div>${body}${selected}<div class="required ${state.selected.length?"complete":""}"><i>${state.selected.length?"✓":"!"}</i><p><strong>${state.selected.length?`${state.selected.length} preferred slot${state.selected.length===1?"":"s"} selected.`:"Select at least one slot."}</strong> ${state.selected.length?"You can select up to three on each day.":"Or skip for now and Ops will follow up manually."}</p></div><div class="footer"><button class="secondary" data-action="scheduler-back">Back</button><div>${state.locked?"":'<button class="skip" data-action="skip">Skip for now</button>'}<button class="primary" data-action="to-consent" ${state.selected.length?"":"disabled"}>${state.locked?"Continue to consent":`Continue${state.selected.length?` with ${state.selected.length} slot${state.selected.length===1?"":"s"}`:""}`}</button></div></div>${state.locked?"":'<p class="skip-note">If you skip, no schedule PDF is created and Ops will contact you by email.</p>'}</div>`}
      function consent(){return `<div class="card consent"><div class="title-row"><div><span class="eyebrow">Consent & submission</span><h1>Review and give your consent</h1><p>Your consent submits this application and its supporting documents to Ruya.</p></div><span class="chip">Final step</span></div>${person("Authorised signatory giving consent")}<div class="schedule-status ${state.skipped?"warning":""}"><div class="doc">${state.skipped?"!":"PDF"}</div><div class="status-body"><span class="eyebrow">Digiconnect availability</span><strong>${state.skipped?"Not provided":`${state.selected.length} preferred slot${state.selected.length===1?"":"s"} ready to submit`}</strong>${state.skipped?'<p>No PDF will be generated. Ops will contact you by email to collect availability.</p>':`${slotTags(state.selected)}<p>Digiconnect Schedule.pdf will be generated at submission and included in the initial Ruya payload.</p>`}</div></div><label class="consent-check"><input id="consentBox" type="checkbox" ${state.consented?"checked":""}><span><strong>I confirm and consent to this submission</strong><small>I confirm the information is correct and authorise Alaan to submit it, the supporting documents${state.skipped?"":" and my preferred Digiconnect call slots"} to Ruya.</small></span></label><div class="footer"><button class="secondary" data-action="consent-back">Back</button><button class="primary" data-action="submit" ${state.consented?"":"disabled"}>Give consent & submit</button></div></div>`}
      function confirmation(){return `<div class="card confirmation"><div class="success">✓</div><span class="eyebrow">Application submitted</span><h1>Thank you, Maya</h1><p>${state.skipped?"Your consent has been recorded and the Business Account application has been sent to Ruya.":"Your consent and preferred call slots have been recorded. The Business Account application has been sent to Ruya."}</p><div class="confirm-list"><div><i>✓</i><div><strong>Application submitted</strong><small>Company details and KYB documents sent to Ruya</small></div></div><div class="${state.skipped?"attention":""}"><i>${state.skipped?"!":"✓"}</i><div><strong>${state.skipped?"Digiconnect availability not provided":`${state.selected.length} preferred call slots shared`}</strong><small>${state.skipped?"Ops will email you to collect availability":"Digiconnect Schedule.pdf included in the initial submission"}</small></div></div><div><i>→</i><div><strong>${state.skipped?"Wait for Ops to contact you":"Wait for Ruya’s confirmation"}</strong><small>${state.skipped?"The existing manual scheduling process will continue":"Ruya will choose one preferred slot and contact you directly"}</small></div></div></div>${state.skipped?'<div class="info"><i>i</i><div><strong>Manual follow-up required</strong><p>This case will be flagged as unscheduled for Ops. No schedule PDF was generated.</p></div></div>':`<div class="confirm-slots"><span class="eyebrow">Slots shared with Ruya</span>${slotTags(state.selected)}</div><div class="pdf-card"><div class="doc">PDF</div><div class="pdf-body"><strong>Digiconnect Schedule.pdf</strong><small>${company.ruyaReference} · generated and included in initial submission</small></div><button class="secondary compact" data-action="pdf">Download</button></div><div class="info"><i>i</i><div><strong>Need a different time?</strong><p>Self-serve rescheduling is not available in v1. Ruya will contact you directly to confirm or adjust the call time.</p></div></div>`}<button class="primary full" data-action="reset">Return to dashboard</button></div>`}
      function render(){let content={review:review,handoff,signatoryReview,scheduler,consent,confirmation}[state.screen]();app.innerHTML=shell(content)}
      function reset(journey=state.journey){state.screen="review";state.journey=journey;state.selected=[];state.consented=false;state.locked=false;state.skipped=false;render()}
      function toggleSlot(id){const all=daySlots.flatMap(x=>x.slots),slot=all.find(x=>x.id===id);if(!slot||state.locked)return;const exists=state.selected.some(x=>x.id===id);if(exists)state.selected=state.selected.filter(x=>x.id!==id);else if(countForDay(slot.dateISO)<3)state.selected=sortSlots([...state.selected,slot]);render()}
      function pdfRow(s){const d=new Date(`${s.dateISO}T00:00:00Z`),day=new Intl.DateTimeFormat("en-GB",{weekday:"long",timeZone:"UTC"}).format(d),date=new Intl.DateTimeFormat("en-GB",{day:"2-digit",month:"short",year:"numeric",timeZone:"UTC"}).format(d);return `${date} | ${day} | ${s.start} - ${s.end} GST`}
      function ascii(s){return s.replace(/[^\x20-\x7E]/g,"-").replace(/[()\\]/g,c=>"\\"+c)}
      function downloadPdf(){const generated=new Intl.DateTimeFormat("en-GB",{dateStyle:"medium",timeStyle:"short",timeZone:"Asia/Dubai"}).format(new Date()),lines=["Digiconnect Schedule","",`Ruya reference / case ID: ${company.ruyaReference}`,`Corporate name: ${company.name}`,`Signatory name: ${company.signatory}`,`Signatory email / phone: ${company.email} / ${company.phone}`,"","Preferred call slots","Date | Day | Time",...sortSlots(state.selected).map(pdfRow),"",`Generated at: ${generated} GST`,"","Ruya will select one preferred slot and contact the signatory to confirm."],content=lines.map((line,i)=>`BT /F1 ${i===0?20:i===7?13:10} Tf 48 ${i===0?790:790-i*27} Td (${ascii(line)}) Tj ET`).join("\n"),objects=["<< /Type /Catalog /Pages 2 0 R >>","<< /Type /Pages /Kids [3 0 R] /Count 1 >>","<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>",`<< /Length ${content.length} >>\nstream\n${content}\nendstream`,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"];let pdf="%PDF-1.4\n",offsets=[0];objects.forEach((o,i)=>{offsets.push(new TextEncoder().encode(pdf).length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});const xref=new TextEncoder().encode(pdf).length;pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n${offsets.slice(1).map(o=>`${String(o).padStart(10,"0")} 00000 n \n`).join("")}trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;const url=URL.createObjectURL(new Blob([pdf],{type:"application/pdf"})),a=document.createElement("a");a.href=url;a.download="Digiconnect-Schedule.pdf";a.click();URL.revokeObjectURL(url)}
      app.addEventListener("click",e=>{const slot=e.target.closest("[data-slot]");if(slot){toggleSlot(slot.dataset.slot);return}const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;if(a==="reset")reset();if(a==="review-next")state.screen=state.journey==="separate"?"handoff":"scheduler";if(a==="open-signatory")state.screen="signatoryReview";if(a==="back-handoff")state.screen="handoff";if(a==="to-scheduler")state.screen="scheduler";if(a==="scheduler-back")state.screen=state.journey==="separate"?"signatoryReview":"review";if(a==="clear")state.selected=[];if(a==="skip"){state.selected=[];state.skipped=true;state.screen="consent"}if(a==="to-consent"&&state.selected.length){state.skipped=false;state.screen="consent"}if(a==="consent-back")state.screen="scheduler";if(a==="submit"&&state.consented){state.locked=state.selected.length>0;state.screen="confirmation"}if(a==="pdf")downloadPdf();render()});
      app.addEventListener("change",e=>{if(e.target.id==="journey"){const j=e.target.value;if(j==="returning"){state.journey=j;state.screen="scheduler";state.selected=[daySlots[0].slots[2],daySlots[0].slots[5],daySlots[1].slots[4]];state.locked=true;state.skipped=false;state.consented=false;render()}else reset(j)}if(e.target.id==="consentBox"){state.consented=e.target.checked;render()}});
      render();
    })();
  </script>
</body>
